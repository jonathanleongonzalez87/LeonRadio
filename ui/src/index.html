<!doctype html>
<html lang="es" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LeonRadio</title>
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="top">
  <div class="brand"><span>Leon<b>Radio</b></span></div>
  <div class="tabs" id="tabs" role="tablist" aria-label="Workspaces"></div>
  <div class="tools">
    <span class="station" id="station"></span>
    <span class="lamp" id="lamp">EN LÍNEA</span>
    <span class="clock" id="clock" aria-label="Hora de la emisora">--:--:--</span>
    <button class="btn-i" id="theme" title="Tema claro/oscuro" aria-label="Cambiar tema">◐</button>
    <button class="btn-i" id="reset" title="Restablecer workspaces" aria-label="Restablecer workspaces">↺</button>
  </div>
</div>
<main id="screen"></main>
<script type="module" src="js/main.js"></script>
</body>
</html>
