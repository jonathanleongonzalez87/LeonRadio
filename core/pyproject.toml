[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "leonradio-core"
version = "0.2.0"
description = "LeonRadio core: motor de automatización de radio (biblioteca, historial, programación, audio)."
readme = "README.md"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
authors = [{ name = "Jonathan León" }]
dependencies = ["mutagen>=1.47", "numpy>=2.0", "tzdata; sys_platform == 'win32'"]

[project.optional-dependencies]
api = ["fastapi>=0.115", "uvicorn>=0.32", "websockets>=13"]
audio = ["sounddevice>=0.5", "miniaudio>=1.60", "lameenc>=1.7"]
dev = ["pytest>=8"]

[project.scripts]
leonradio = "leonradio_core.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/leonradio_core", "src/leonradio"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
