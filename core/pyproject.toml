[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "leonradio-core"
version = "0.0.1"
description = "LeonRadio core: motor de automatización de radio (biblioteca, historial, programación, audio)."
readme = "README.md"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
authors = [{ name = "Jonathan León" }]
dependencies = ["mutagen>=1.47"]

[project.optional-dependencies]
api = ["fastapi>=0.115", "uvicorn>=0.32"]
dev = ["pytest>=8"]

[project.scripts]
leonradio = "leonradio_core.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/leonradio_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
